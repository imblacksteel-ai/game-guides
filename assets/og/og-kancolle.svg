<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2338"/>
      <stop offset="100%" stop-color="#050c14"/>
    </linearGradient>
    <pattern id="stripe" width="40" height="40" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <rect width="20" height="40" fill="#d4af5a"/>
      <rect x="20" width="20" height="40" fill="#0e2338"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <rect x="0" y="0" width="1200" height="10" fill="url(#stripe)" opacity="0.9"/>

  <rect x="90" y="70" width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#d4af5a" stroke-opacity="0.4"/>
  <text x="107" y="97" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#d4af5a">JP ONLY</text>

  <text x="88" y="270" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="800" fill="#eef2f5">KanColle</text>
  <text x="90" y="320" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#eef2f5">Guide</text>

  <text x="90" y="400" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#c8d3da">UI Glossary · Getting Started · Air Power Calculator</text>

  <text x="90" y="580" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#9fb0ba">Kouryaku Lab</text>

  <rect x="0" y="620" width="1200" height="10" fill="url(#stripe)" opacity="0.9"/>
</svg>
