  <rect x="90" y="0" width="1200" height="10" fill="url(#stripe)"/>

  <text x="90" y="220" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#6bc590">GAME GUIDES &amp; TOOLS</text>

  <text x="88" y="330" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="800" fill="#f2f5f1">Kouryaku Lab</text>

  <text x="90" y="400" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#a3aca4">Mobile game guides, and the annoying math done for you.</text>

  <rect x="0" y="620" width="1200" height="10" fill="url(#stripe)"/>
